{% extends "base.html" %}

{% block extra_head %}
<style>
    body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }
    .container {
        width: 100%;
        max-width: 100%;
        padding: 0;
    }
    .auth-layout {
        min-height: calc(100vh - 80px);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 3rem 1rem;
        margin-top: -80px; /* Offset for navbar */
        padding-top: 100px;
    }
    .auth-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
    }
    .auth-bg img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .auth-blur {
        position: absolute;
        inset: 0;
        background: rgba(15, 23, 42, 0.5);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
    }
    .auth-card {
        background: rgba(255, 255, 255, 0.95);
        width: 100%;
        max-width: 600px;
        padding: 3rem;
        position: relative;
        z-index: 10;
        animation: fadeInUp 0.6s ease;
    }
    .avatar-upload {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: #F1F5F9;
        margin: 0 auto 2rem auto;
        border: 2px dashed #CBD5E1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        cursor: pointer;
        position: relative;
        transition: var(--transition);
    }
    .avatar-upload:hover {
        border-color: var(--primary);
        color: var(--primary);
    }
    .avatar-badge {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 32px;
        height: 32px;
        background: var(--white);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-soft);
        color: var(--primary);
    }
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.25rem;
    }
    @media (max-width: 640px) {
        .grid-2 { grid-template-columns: 1fr; }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-layout">
    <div class="auth-bg">
        <img src="https://images.unsplash.com/photo-1506929562872-bb421503ef21?w=1600&auto=format&fit=crop" alt="Travel Background">
        <div class="auth-blur"></div>
    </div>

    <div class="glass-card auth-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 2rem; margin-bottom: 0.5rem;">Create Account</h2>
            <p style="color: var(--muted);">Join Traveloop to start designing your dream trips.</p>
        </div>

        <form method="POST" action="{{ url_for('signup') }}">
            
            <div class="avatar-upload">
                <i data-lucide="user" style="width: 40px; height: 40px;"></i>
                <div class="avatar-badge">
                    <i data-lucide="camera" style="width: 16px; height: 16px;"></i>
                </div>
            </div>

            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="first_name">First Name</label>
                    <input type="text" id="first_name" name="name" class="form-control" required placeholder="John">
                </div>
                <div class="form-group">
                    <label class="form-label" for="last_name">Last Name</label>
                    <input type="text" id="last_name" name="last_name" class="form-control" placeholder="Doe">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="input-icon-wrapper">
                    <i data-lucide="mail" class="input-icon"></i>
                    <input type="email" id="email" name="email" class="form-control with-icon" required placeholder="you@example.com">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="input-icon-wrapper">
                    <i data-lucide="lock" class="input-icon"></i>
                    <input type="password" id="password" name="password" class="form-control with-icon" required placeholder="••••••••">
                </div>
            </div>
            
            <div class="grid-2">
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="phone" class="input-icon"></i>
                        <input type="tel" id="phone" name="phone" class="form-control with-icon" placeholder="+1 (555) 000-0000">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="city">City</label>
                    <div class="input-icon-wrapper">
                        <i data-lucide="map-pin" class="input-icon"></i>
                        <input type="text" id="city" name="city" class="form-control with-icon" placeholder="New York">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="country">Country</label>
                <div class="input-icon-wrapper">
                    <i data-lucide="globe" class="input-icon"></i>
                    <select id="country" name="country" class="form-control with-icon" style="appearance: none; background-color: #F1F5F9;">
                        <option value="">Select Country</option>
                        <option value="US">United States</option>
                        <option value="UK">United Kingdom</option>
                        <option value="CA">Canada</option>
                        <option value="AU">Australia</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="info">Additional Information</label>
                <textarea id="info" name="info" class="form-control" rows="3" placeholder="Tell us about your travel preferences..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-full" style="margin-top: 1rem; padding: 1rem; font-size: 1.1rem;">
                Register
            </button>
        </form>

        <div style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--muted);">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Log In</a>
        </div>
    </div>
</div>
{% endblock %}
