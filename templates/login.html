{% extends "base.html" %}

{% block extra_head %}
<style>
    :root {
        --auth-primary: #6366f1;
        --auth-secondary: #a855f7;
        --auth-bg: #0f172a;
        --auth-card-bg: rgba(255, 255, 255, 0.05);
        --auth-text: #f8fafc;
        --auth-muted: #94a3b8;
    }

    body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: var(--auth-bg);
        color: var(--auth-text);
    }

    .auth-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        padding: 2rem 1rem;
        z-index: 1;
    }

    .auth-background {
        position: fixed;
        inset: 0;
        z-index: -1;
    }

    .auth-background img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.6;
    }

    .auth-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at center, transparent 0%, rgba(15, 23, 42, 0.8) 100%);
    }

    .auth-card-wrapper {
        width: 100%;
        max-width: 440px;
        perspective: 1000px;
    }

    .auth-card {
        background: rgba(15, 23, 42, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 3rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.95);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-title {
        font-size: 2.25rem;
        font-weight: 800;
        text-align: center;
        margin-bottom: 0.5rem;
        background: linear-gradient(to right, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.025em;
    }

    .auth-subtitle {
        color: var(--auth-muted);
        text-align: center;
        margin-bottom: 2.5rem;
        font-size: 1rem;
    }

    .form-group {
        margin-bottom: 1.5rem;
        position: relative;
    }

    .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-size: 0.875rem;
        font-weight: 500;
        color: var(--auth-muted);
        transition: color 0.2s;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-icon {
        position: absolute;
        left: 1rem;
        color: var(--auth-muted);
        transition: color 0.2s;
    }

    .auth-input {
        width: 100%;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        padding: 0.75rem 1rem 0.75rem 3rem;
        color: white;
        font-size: 1rem;
        transition: all 0.3s;
        outline: none;
    }

    .auth-input:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--auth-primary);
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
    }

    .auth-input:focus + .input-icon {
        color: var(--auth-primary);
    }

    .password-toggle {
        position: absolute;
        right: 1rem;
        background: none;
        border: none;
        color: var(--auth-muted);
        cursor: pointer;
        transition: color 0.2s;
    }

    .password-toggle:hover {
        color: white;
    }

    .btn-auth {
        width: 100%;
        background: linear-gradient(135deg, var(--auth-primary), var(--auth-secondary));
        color: white;
        border: none;
        border-radius: 12px;
        padding: 1rem;
        font-size: 1.125rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 1rem;
        box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .btn-auth:hover {
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.4);
        filter: brightness(1.1);
    }

    .auth-footer {
        margin-top: 2rem;
        text-align: center;
        font-size: 0.875rem;
        color: var(--auth-muted);
    }

    .auth-link {
        color: var(--auth-primary);
        text-decoration: none;
        font-weight: 600;
        margin-left: 0.25rem;
        transition: color 0.2s;
    }

    .auth-link:hover {
        color: var(--auth-secondary);
    }

    .forgot-password {
        display: block;
        text-align: right;
        font-size: 0.75rem;
        color: var(--auth-muted);
        text-decoration: none;
        margin-top: 0.5rem;
        transition: color 0.2s;
    }

    .forgot-password:hover {
        color: var(--auth-primary);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-background">
        <img src="{{ url_for('static', filename='images/auth_bg.png') }}" alt="Travel Background" onerror="this.src='https://images.unsplash.com/photo-1506929562872-bb421503ef21?w=1600&auto=format&fit=crop'">
        <div class="auth-overlay"></div>
    </div>

    <div class="auth-card-wrapper">
        <div class="auth-card">
            <div class="auth-logo">
                <i data-lucide="plane-takeoff" style="width: 48px; height: 48px; color: var(--auth-primary); margin-bottom: 1rem;"></i>
            </div>
            
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Log in to continue your world exploration.</p>

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" class="input-icon"></i>
                        <input type="email" id="email" name="email" class="auth-input" required placeholder="name@company.com">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" class="input-icon"></i>
                        <input type="password" id="password" name="password" class="auth-input" required placeholder="••••••••">
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <i data-lucide="eye" id="eye-icon" style="width: 20px; height: 20px;"></i>
                        </button>
                    </div>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn-auth">
                    Log In <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? 
                <a href="{{ url_for('signup') }}" class="auth-link">Create Account</a>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eye-icon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.setAttribute('data-lucide', 'eye-off');
        } else {
            passwordInput.type = 'password';
            eyeIcon.setAttribute('data-lucide', 'eye');
        }
        
        // Re-initialize lucide for the icon change
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    });
</script>
{% endblock %}
