{% extends "base.html" %}

{% block extra_head %}
<style>
    .auth-container {
        max-width: 400px;
        margin: 4rem auto;
    }
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    .auth-header h2 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
    }
    .auth-header p {
        color: var(--text-muted);
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container card">
    <div class="auth-header">
        <h2>Welcome Back</h2>
        <p>Log in to access your trips.</p>
    </div>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" name="email" class="form-control" required placeholder="you@example.com">
        </div>
        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" required placeholder="••••••••">
        </div>
        <div class="form-group" style="text-align: right;">
            <a href="#" style="color: var(--primary); font-size: 0.9rem; text-decoration: none;">Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary w-full">Log In</button>
    </form>
    <div class="mt-2 text-center" style="font-size: 0.9rem;">
        Don't have an account? <a href="{{ url_for('signup') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Sign Up</a>
    </div>
</div>
{% endblock %}
