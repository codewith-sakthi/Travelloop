{% extends "base.html" %}

{% block extra_head %}
<style>
    .create-trip-container {
        max-width: 600px;
        margin: 0 auto;
    }
    .date-row {
        display: flex;
        gap: 1rem;
    }
    .date-row .form-group {
        flex: 1;
    }
</style>
{% endblock %}

{% block content %}
<div class="create-trip-container">
    <div class="card">
        <h2 style="margin-bottom: 1.5rem;">Plan a New Trip</h2>
        <form method="POST" action="{{ url_for('create_trip') }}">
            <div class="form-group">
                <label class="form-label" for="name">Trip Name</label>
                <input type="text" id="name" name="name" class="form-control" required placeholder="E.g., Euro Trip Summer 2026">
            </div>
            <div class="date-row">
                <div class="form-group">
                    <label class="form-label" for="start_date">Start Date</label>
                    <input type="date" id="start_date" name="start_date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="end_date">End Date</label>
                    <input type="date" id="end_date" name="end_date" class="form-control" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="description">Trip Description (Optional)</label>
                <textarea id="description" name="description" class="form-control" rows="4" placeholder="What is the vibe of this trip?"></textarea>
            </div>
            <div class="form-group" style="margin-top: 2rem; display: flex; justify-content: flex-end; gap: 1rem;">
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline">Cancel</a>
                <button type="submit" class="btn btn-primary">Create Trip</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
